<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formuláro Empresa</title>
    <style>
      label {
        display: block;
      }

      div {
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <form action="index.php" method="post">
        <h1>Formulário Empresa</h1>
        <div>
          <label for="complete-name">Nome Completo:</label>
          <input type="text" id="complete-name" name="complete-name" required />
        </div>
        <div>
          <label for="age">Idade:</label>
          <input type="number" id="age" name="age" required />
        </div>
        <div>
          <label for="occupation">Profissão:</label>
          <input type="text" id="occupation" name="occupation" required />
        </div>
        <div>
          <label for="salary">Pretensão Salárial:</label>
          <input type="number" id="salary" name="salary" required />
        </div>
        <div>
          <label for="last-experience">Experiência Anterior:</label>
          <textarea
            id="last-experience"
            name="last-experience"
            required
          ></textarea>
        </div>
        <button type="submit">Cadastrar</button>
        <button type="submit" formmethod="get">Enviar</button>
      </form>
    </main>
  </body>
</html>
